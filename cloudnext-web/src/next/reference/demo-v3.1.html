*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.55 var(--font);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
body[data-density="compact"]{--row-padding-y:8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;white-space:nowrap;border:0;background:none;transition:background .14s ease,color .14s ease,border-color .14s ease,box-shadow .14s ease}
button,input,select,textarea{outline:none}
button,a,input{-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;color:var(--tone-disabled-ink);opacity:.62}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:not([type=checkbox]):focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=search]::-webkit-search-cancel-button{display:none}
svg{display:block;flex-shrink:0}.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.small{width:16px;height:16px}.ic.large{width:24px;height:24px}
h1,h2,h3,p{margin:0}dl{margin:0}a{color:var(--accent)}[hidden]{display:none!important}
.muted{color:var(--muted)}.small-text{font-size:13px}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
.spacer{flex:1}.flex{display:flex;align-items:center;gap:10px}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
/* Persistent app frame */
.app{display:flex;width:100%;height:100vh;height:100dvh;min-height:0;overflow:hidden}
.main{display:flex;flex-direction:column;flex:1 1 0%;min-width:0;min-height:0;overflow:hidden}
.workspace{display:flex;flex:1 1 0%;min-width:0;min-height:0;position:relative;overflow:hidden}
.content-scroll{display:flex;flex:1 1 0%;min-width:0;min-height:0;padding:28px var(--content-x) 20px;overflow:hidden}
.page-screen{display:flex;flex-direction:column;flex:1 1 0%;min-width:0;min-height:0;overflow:hidden}
/* Sidebar: quiet surface, distinct active state, no oversized cards */
.sidebar{width:var(--sidebar);flex:none;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:0 16px;background:var(--side);border-right:1px solid var(--line);z-index:30}
.brand{height:84px;display:flex;align-items:center;gap:11px;padding:0 10px;flex:none}
.brand-symbol{width:37px;height:39px;display:grid;place-items:center;color:var(--accent);background:var(--tone-brand-bg);border-radius:9px}
.brand-symbol svg{width:28px;height:28px}
.brand-cn{font-size:23px;line-height:1.18;font-weight:700;letter-spacing:2px}
.brand-en{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;letter-spacing:.7px}
.new-wrap{flex:0 0 auto;position:relative;margin:3px 0 23px}
.new-button{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 14px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:var(--accent-ink);font-size:14px;font-weight:600}
.new-button:hover{border-color:var(--tone-new-hover-border);background:var(--tone-new-hover-bg)}.new-button:active{background:var(--accent-soft)}
.new-button .spare-new{margin-left:auto;color:var(--muted)}
.sidebar-middle{flex:1 1 0%;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--tone-sidebar-scroll) transparent;padding-bottom:8px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;height:42px;position:relative;border-radius:6px;padding:0 13px;text-align:left;font-size:14px;color:var(--tone-nav-ink)}
.nav-item .ic{width:18px;height:18px;color:var(--tone-nav-icon)}
.nav-item:hover{background:var(--tone-nav-hover);color:var(--ink)}
.nav-item.active{background:var(--tone-nav-active);color:var(--accent-ink);font-weight:650}
.nav-item.active .ic{color:var(--accent)}
.nav-item.active:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-count{margin-left:auto;min-width:22px;padding:1px 5px;border-radius:4px;text-align:center;color:var(--muted);background:var(--tone-nav-count-bg);font-size:12px;font-weight:500}
.recent-side{margin:25px 2px 0;padding-top:21px;border-top:1px solid var(--line)}
.side-label{display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:550}
.side-label button{display:flex;align-items:center;gap:3px;font-size:12px;padding:3px 0;color:var(--muted)}
.side-label button .ic{width:13px;height:13px}.side-label button:hover,.side-label button.active{color:var(--accent);font-weight:600}
.recent-item{display:flex;align-items:center;gap:10px;padding:10px;width:100%;border-radius:6px;text-align:left}
.recent-item:hover{background:var(--tone-recent-hover)}.recent-info{min-width:0;flex:1}
.recent-name{font-size:13px;color:var(--text);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-time{font-size:12px;line-height:1.4;display:block;margin-top:4px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-bottom{margin-top:auto;flex:0 0 auto;padding:18px 10px 18px}
.storage-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:12px}.storage-title .ic{width:14px;height:14px}
.storage-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:9px;font-variant-numeric:tabular-nums}
.storage-line strong{color:var(--text);font-weight:550}
.storage-track{height:4px;background:var(--tone-storage-track);border-radius:4px}.storage-track span{display:block;background:var(--tone-storage-fill);height:4px;width:28.4%;border-radius:4px}
.workspace-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:19px;padding-top:15px;border-top:1px solid var(--line)}.workspace-label .ic{width:15px;height:15px}
/* Global bar */
.topbar{height:70px;min-height:70px;flex:0 0 auto;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 var(--content-x);background:#fff}
.search-box{height:39px;width:min(500px,48vw);display:flex;align-items:center;gap:11px;background:var(--tone-search-bg);border:1px solid var(--tone-search-border);border-radius:6px;padding:0 12px;color:var(--tone-search-icon);transition:border-color .15s,background .15s,box-shadow .15s}
.search-box:focus-within{background:#fff;border-color:var(--tone-focus-border);box-shadow:0 0 0 3px var(--tone-focus-ring)}
.search-box input{width:100%;min-width:0;padding:0;background:none;border:0;font-size:14px;color:var(--ink);outline:none!important;box-shadow:none!important}
.search-box input::placeholder{color:var(--tone-placeholder)}.search-box>.ic{width:18px;height:18px}
.keycap{font:12px/21px var(--font);padding:0 5px;color:var(--muted);border:1px solid var(--tone-keycap-border);border-radius:3px;background:#fff;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.demo-badge{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap;margin-right:4px}
.demo-badge:before{content:"";width:5px;height:5px;background:var(--tone-demo-dot);border-radius:50%}
.top-separator{height:20px;width:1px;background:var(--line);margin:0 5px}
.icon-button{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted);border:1px solid transparent;border-radius:5px}
.icon-button:hover{background:var(--tone-icon-hover);color:var(--accent)}.icon-button:active{background:var(--tone-icon-pressed)}
.icon-button.on{background:#fff;color:var(--accent-ink);border-color:var(--tone-icon-on-border)}
.avatar{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:550;background:#e5eee7;color:#4f715b}
.avatar.blue{background:#e8eef6;color:#55749a}.avatar.green{background:#edf0e1;color:#6e7e47}.avatar.pink{background:#f4e9e3;color:#9a6f58}.avatar.grey{background:#e9edef;color:#60707e}
.avatar-btn{display:flex;align-items:center;gap:9px;padding:3px 4px 3px 7px;border-radius:6px;margin-left:3px}.avatar-btn:hover{background:var(--tone-profile-hover)}

function navItems(){return [['home','首页','home'],['files','我的文件','file'],['shared','共享文件','shared'],['spaces','协作空间','people'],['links','外链管理','globe'],['trash','回收站','trash']]}

// Only preserve a scroll offset when the same page/data ordering is re-rendered.
// Selection and star changes must not jump back to the first row.
function renderContent(){
 const content=$('#content'), oldScroll=content.querySelector('.table-scroll');
 const offset={top:oldScroll?.scrollTop||0,left:oldScroll?.scrollLeft||0};
 const active=document.activeElement;
 let focusSelector='';
 if(active&&content.contains(active)){
   if(active.id)focusSelector='#'+CSS.escape(active.id);
   else if(active.dataset.select)focusSelector='[data-select="'+CSS.escape(active.dataset.select)+'"]';
   else if(active.dataset.rowId)focusSelector='[data-row-id="'+CSS.escape(active.dataset.rowId)+'"]';
   else if(active.dataset.action){
     focusSelector='[data-action="'+CSS.escape(active.dataset.action)+'"]';
     for(const k of ['id','page','filter','layout'])if(active.dataset[k])focusSelector+='[data-'+k+'="'+CSS.escape(active.dataset[k])+'"]';
   }
 }
 state.pageFileIds=[];
 let html='';if(state.view==='home')html=renderHome();else if(state.view==='spaces')html=renderSpaces();else if(state.view==='links')html=renderLinks();else html=renderFiles();
 const key=JSON.stringify([state.view,state.folder,state.space,state.query,state.filter,state.shareTab,state.linkTab,state.page,state.pageSize,model.prefs.layout,state.sort,state.reverse]);
 const preserve=content.dataset.renderKey===key;
 content.innerHTML=`<div class="page-screen" data-view="${esc(state.view)}">${html}</div>`;
 content.dataset.renderKey=key;
 const scroller=content.querySelector('.table-scroll');
 if(preserve&&scroller){scroller.scrollTop=offset.top;scroller.scrollLeft=offset.left}
 const all=$('#selectAll');
 if(all){const rows=displayedFiles();all.disabled=!rows.length;all.checked=!!rows.length&&rows.every(f=>state.selected.has(f.id));all.indeterminate=rows.some(f=>state.selected.has(f.id))&&!all.checked}
 if(focusSelector)content.querySelector(focusSelector)?.focus({preventScroll:true});
 syncDetailState();
}
function allMineRoot(){return model.files.filter(f=>visible(f)&&f.area==='mine'&&f.parent==='root')}
function folderPath(id){let arr=[],seen=new Set();while(id&&id!=='root'&&!seen.has(id)){seen.add(id);let f=file(id);if(!f)break;arr.unshift(f);id=f.parent}return arr}
function locationName(f){if(f.parent!=='root'){const p=file(f.parent);if(p)return p.name;const s=model.spaces.find(s=>s.id===f.parent);if(s)return s.name}return f.area==='shared'?(f.source||'共享文件'):f.area==='space'?'协作空间':'我的文件'}
function descCount(f){return model.files.filter(x=>visible(x)&&x.parent===f.id).length}
function currentFiles(){
 let list=[];
 if(state.view==='files')list=model.files.filter(f=>visible(f)&&f.area==='mine'&&f.parent===state.folder);
 if(state.view==='spaceFiles')list=model.files.filter(f=>visible(f)&&f.area==='space'&&f.parent===state.folder);
 if(state.view==='shared')list=model.files.filter(f=>visible(f)&&(state.shareTab==='received'?f.area==='shared':f.area==='mine'&&f.shared));
 if(state.view==='trash')list=model.files.filter(f=>f.deleted);
 if(state.view==='recent')list=model.recent.map(file).filter(f=>f&&visible(f));
 if(state.view==='search'){const q=state.query.trim().toLowerCase();list=model.files.filter(f=>visible(f)&&(f.name.toLowerCase().includes(q)||locationName(f).toLowerCase().includes(q)))}
 if(state.filter!=='all'){list=list.filter(f=>state.filter==='doc'?['word','pdf','md'].includes(f.type):state.filter==='image'?['image','fig'].includes(f.type):state.filter==='other'?['zip','other'].includes(f.type):f.type===state.filter)}
 if(!(state.view==='recent'&&state.sort==='opened'))list=sortFileList(list);
 return list;
}
function head(title,sub,actions='',crumb=''){

 const scope=scopes[state.view];
 return `${crumb}<header class="page-head"><div><div class="page-title-line"><h1 class="page-title">${esc(title)}</h1>${scope?`<span class="page-scope">${ic(scope[0])}${scope[1]}</span>`:''}</div>${sub?`<p class="page-subtitle">${sub}</p>`:''}</div><div class="head-actions">${actions}</div></header>`;
}
function breadcrumb(){if(state.view==='spaceFiles'){const s=model.spaces.find(s=>s.id===state.space);return `<div class="breadcrumb"><button data-action="nav" data-view="spaces">协作空间</button>${ic('right')}<span>${esc(s?.name||'团队空间')}</span>${folderPath(state.folder).map(f=>`${ic('right')}<button data-action="open" data-id="${f.id}">${esc(f.name)}</button>`).join('')}</div>`}if(state.folder!=='root'&&state.view==='files')return `<div class="breadcrumb"><button data-action="nav" data-view="files">我的文件</button>${folderPath(state.folder).map(f=>`${ic('right')}<button data-action="open" data-id="${f.id}">${esc(f.name)}</button>`).join('')}</div>`;return ''}
function folderStrip(folders,label='常用文件夹'){
 if(!folders.length)return '';
 return `<section class="folder-section"><div class="section-heading"><h2>${label}</h2><span class="small-text muted">${folders.length} 个文件夹</span></div><div class="folder-strip">${folders.map(f=>`<button class="folder-card" data-action="open" data-id="${f.id}" title="打开 ${esc(f.name)}"><span class="folder-top">${folderIcon(f.color)}<span class="folder-people">${ic(f.shared?'people':'lock')}${f.shared?'共享':''}</span></span><span><span class="folder-title">${esc(f.name)}</span><span class="folder-meta" style="display:block">${descCount(f)} 个文件 · ${esc(f.desc||'工作资料')}</span></span><span class="folder-arrow">${ic('right')}</span></button>`).join('')}</div></section>`;
}
function filterBar(){
 if(state.selected.size){
  const selected=selectedFiles(),managed=selected.length>0&&selected.every(canManage),one=selected.length===1?selected[0]:null,trash=state.view==='trash';
  const actions=trash?btn('恢复','restoreSelected','restore','ghost')+btn('永久删除','purgeSelected','trash','ghost selection-danger'):
   (one&&managed?btn('分享','share','shared','ghost',`data-id="${one.id}"`):'')+
   btn('下载样例','downloadSelected','download','ghost')+
   (managed?btn('移动','moveSelected','move','ghost')+btn('删除','deleteSelected','trash','ghost selection-danger'):'')+
   (one?btn('详情','detailSelected','info','ghost'):'');
  return `<div class="selectionbar" role="toolbar" aria-label="已选文件操作"><span class="selection-count">已选择 <b>${state.selected.size}</b> 项</span>${actions}<button class="cancel-selection" data-action="clearSelection" title="取消选择（Esc）">${ic('close')}<span>取消选择</span></button></div>`;
 }

 return `<div class="toolbar"><div class="filter-tabs" role="group" aria-label="文件类型筛选">${filtersets.map(([id,label])=>`<button class="filter-tab ${state.filter===id?'active':''}" data-action="filter" data-filter="${id}" aria-pressed="${state.filter===id}">${label}${id==='all'?`<span>${rawCount()}</span>`:''}</button>`).join('')}</div><div class="toolbar-right"><button class="icon-button view-pref" data-action="preferences" title="显示设置：密度与视图" aria-label="显示设置">${ic('sliders')}</button>${state.view!=='trash'?`<div class="view-switch" role="group" aria-label="显示方式"><button class="icon-button ${model.prefs.layout==='list'?'on':''}" data-action="layout" data-layout="list" aria-label="列表视图" title="列表视图" aria-pressed="${model.prefs.layout==='list'}">${ic('list')}</button><button class="icon-button ${model.prefs.layout==='grid'?'on':''}" data-action="layout" data-layout="grid" aria-label="网格视图" title="网格视图" aria-pressed="${model.prefs.layout==='grid'}">${ic('grid')}</button></div>`:''}</div></div>`;
}
function displayedFiles(){return state.pageFileIds.map(file).filter(Boolean)}
function rawCount(){const filter=state.filter;state.filter='all';const n=currentFiles().length;state.filter=filter;return n}
function selectedFiles(){return [...state.selected].map(file).filter(Boolean)}
function sortDirection(key){
 if(state.sort!==key)return 'none';
 return (key==='name'?!state.reverse:state.reverse)?'ascending':'descending';
}
function sortIcon(key){
 const dir=sortDirection(key);
 return dir==='none'?`<svg class="ic small sort-neutral" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8 4-4 4 4M8 16l4 4 4-4"/></svg>`:ic(dir==='ascending'?'up':'down','small');
}
function sortFileList(list){
 return [...list].sort((a,b)=>{
  if((a.type==='folder')!==(b.type==='folder'))return a.type==='folder'?-1:1;
  const key=state.view==='trash'?'deletedAt':'date';
  const n=state.sort==='name'?a.name.localeCompare(b.name,'zh-CN',{numeric:true}):String(b[key]||'').localeCompare(String(a[key]||''));
  return (state.reverse?-n:n)||String(a.id).localeCompare(String(b.id));
 });
}
function toggleSort(key){
 if(state.sort===key)state.reverse=!state.reverse;else{state.sort=key;state.reverse=false}
 state.page=1;state.selected.clear();renderContent();
}
function paginate(list){
 const size=state.pageSize,total=Math.max(1,Math.ceil(list.length/size));
 state.page=Math.min(total,Math.max(1,Number(state.page)||1));state.pageCount=total;
 const start=(state.page-1)*size;
 return {items:list.slice(start,start+size),total,totalItems:list.length,page:state.page,start:list.length?start+1:0,end:Math.min(start+size,list.length)};
}
function changePage(page){
 const next=Math.max(1,Math.min(state.pageCount,Number(page)||1));
 if(next===state.page)return;
 state.page=next;state.selected.clear();closeDetails();renderContent();
 $('#content .pager-btn.current')?.focus({preventScroll:true});
}
function renderPager(meta,label='项'){
 const pages=[];
 for(let i=1;i<=meta.total;i++)if(i===1||i===meta.total||Math.abs(i-meta.page)<=1)pages.push(i);
 const compact=[];pages.forEach((p,i)=>{if(i&&p-pages[i-1]>1)compact.push('gap');compact.push(p)});
 return `<footer class="table-pager" aria-label="分页栏"><div class="pager-meta" role="status">共 <strong>${meta.totalItems}</strong> ${label}<span> · 显示 ${meta.start}–${meta.end}</span></div><nav class="pager-controls" aria-label="分页导航"><label class="page-size-label" for="pageSize">每页<select id="pageSize" class="page-size-select" aria-label="每页显示条数">${[10,20,50,100].map(n=>`<option value="${n}" ${n===state.pageSize?'selected':''}>${n} 条</option>`).join('')}</select></label><div class="page-number-group"><button class="pager-btn" data-action="pagePrev" ${meta.page===1?'disabled':''} aria-label="上一页">${ic('left')}上一页</button>${compact.map(p=>p==='gap'?'<span class="pager-gap" aria-hidden="true">…</span>':`<button class="pager-btn ${p===meta.page?'current':''}" data-action="pageTo" data-page="${p}" aria-label="第 ${p} 页" ${p===meta.page?'aria-current="page"':''}>${p}</button>`).join('')}<button class="pager-btn" data-action="pageNext" ${meta.page===meta.total?'disabled':''} aria-label="下一页">下一页${ic('right')}</button></div></nav></footer>`;
}
function renderTableShell(inner,meta,label='项',scrollClass=''){

  actions=btn('新建文件夹','newFolder','plus')+btn('上传文件','upload','upload','primary');
  if(state.view==='spaceFiles')info=`<div class="info-strip">${ic('people')}<span>${esc(s?.owner||'林沐')}负责维护 · ${s?.members||1} 位成员</span><span class="spacer"></span>${btn('查看成员','spaceMembers','people','small ghost')}</div>`;
 }else if(state.view==='shared'){

 }else if(state.view==='trash'){
  sub=`${rawCount()} 个已删除项目 · 仅影响本地演示数据`;

  info=`<div class="info-strip">${ic('info')}<span>可恢复到原位置。永久删除需要确认；不会删除电脑上的原文件。</span></div>`;
 }else if(state.view==='recent')sub='继续处理最近使用的文件，原文件位置保持不变。';
 else if(state.view==='search'){sub=`在可访问的示例文件中搜索“${esc(state.query)}”，找到 ${rawCount()} 个结果。`;actions=btn('清除搜索','clearSearch','close')}
 const meta=paginate(list),grid=model.prefs.layout==='grid'&&state.view!=='trash';
 const noFiles=emptyBlock(state.view==='trash'?'回收站很干净':state.view==='search'?'没有找到匹配的文件':'这里还没有文件',state.view==='search'?'试试更短的关键词，或清除当前筛选。':state.view==='trash'?'删除的文件会出现在这里，你可以选择恢复。':'新建文件夹，或添加一份本地文件开始体验。',state.view==='search'?btn('清除搜索','clearSearch','refresh'):state.view==='files'?btn('上传文件','upload','upload','primary'):'');

function renderTable(list,home=false,meta=null,label='项',empty=''){

 state.pageFileIds=list.map(f=>f.id);

 return meta?renderTableShell(table,meta,label):table;

function validateName(name){return name.length<1?'请输入名称。':name.length>100?'名称请控制在 100 个字符以内。':/[\\/:*?"<>|]/.test(name)?'名称不能包含 \\ / : * ? " < > |。':null}
function targetParent(){return ['files','spaceFiles'].includes(state.view)?state.folder:'root'}
function newItem(type){formMode=type;
 const fields=`<label class="field"><span>${type==='newFolder'?'文件夹名称':'文档名称'}</span><input class="input" name="name" maxlength="100" value="${type==='newFolder'?'':'未命名文档.md'}" placeholder="${type==='newFolder'?'例如：九月项目资料':'文档名称.md'}" required></label>${type==='newDoc'?'<label class="field"><span>文档内容</span><textarea class="input input-area" name="body" maxlength="20000" placeholder="写下你的第一段内容…"></textarea></label>':''}`;
 formModal(type==='newFolder'?'新建文件夹':'新建本地文档',fields,type,'创建','创建于 '+esc(targetParent()==='root'?'我的文件':file(targetParent())?.name||model.spaces.find(s=>s.id===targetParent())?.name||'当前空间')+'。更改仅保存在当前浏览器。');
}
function descendants(ids){const found=new Set(ids);let changed=true;while(changed){changed=false;model.files.forEach(f=>{if(found.has(f.parent)&&!found.has(f.id)){found.add(f.id);changed=true}})}return found}
let operationIds=[];
function askDelete(ids,permanent=false){operationIds=ids;const many=descendants(ids);confirmModal(permanent?'永久删除这些文件？':'移入回收站？',permanent?`将从本地原型永久删除 <strong>${many.size}</strong> 个项目，此操作无法撤销。不会删除电脑上的原文件。`:`将 <strong>${many.size}</strong> 个项目移入回收站。你之后可以恢复它们。`,permanent?'confirmPurge':'confirmDelete','',permanent?'永久删除':'移入回收站')}
function doDelete(permanent=false){const ids=descendants(operationIds);if(permanent){model.files=model.files.filter(f=>!ids.has(f.id));model.recent=model.recent.filter(id=>!ids.has(id));ids.forEach(id=>{model.members[id]&&delete model.members[id];localBlobs.delete(id)});model.links=model.links.filter(l=>!ids.has(l.file))}else {const batch=uid();model.files.forEach(f=>{if(ids.has(f.id)&&canManage(f)){f.deleted=true;f.deletedAt=nowStamp();f.origin=locationName(f);f.deleteBatch=batch}})}state.selected.clear();closeDetails();persist();closeModal();render();toast(permanent?'已永久删除选中的本地演示数据。':'已移入回收站，可以随时恢复。')}
function restoreFiles(ids){let idset=new Set(ids);ids.map(file).filter(Boolean).forEach(f=>{if(f.type==='folder'){const batch=f.deleteBatch;descendants([f.id]).forEach(id=>{if(file(id)?.deleteBatch===batch)idset.add(id)})}});idset.forEach(id=>{const f=file(id);if(!f)return;f.deleted=false;if(file(f.parent)?.deleted)f.parent=f.area==='space'?f.space:'root';let name=f.name,n=1;while(duplicateName(name,f.parent,f.id)){const dot=f.type==='folder'?-1:f.name.lastIndexOf('.');const base=dot>0?f.name.slice(0,dot):f.name,ext=dot>0?f.name.slice(dot):'';name=base+`（恢复 ${n++}）`+ext}f.name=name});state.selected.clear();closeDetails();persist();closeModal();render();toast(`已恢复 ${idset.size} 个项目；重名时自动保留副本。`)}
function moveFiles(ids){operationIds=ids;const exclude=descendants(ids);const first=file(ids[0]);if(!ids.every(id=>canManage(file(id)))){toast('选择中包含不可移动的文件。','info');return}const roots=first.area==='space'?model.spaces.filter(s=>s.id===first.space).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''):'<option value="root">我的文件 / 根目录</option>';const dirs=model.files.filter(f=>visible(f)&&f.type==='folder'&&!exclude.has(f.id)&&f.area===first.area&&(first.area!=='space'||f.space===first.space));formModal('移动文件',`<label class="field"><span>目标文件夹</span><select class="input" name="parent">${roots}${dirs.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label>`,'confirmMove','移动',`已选择 ${ids.length} 个项目。只允许在所属工作空间内移动。`)}
function downloadFile(f){
 if(f.type==='folder'){toast('文件夹打包下载不在本原型范围内。','info');return}
 let blob,name;
 if(f.userAdded){if(localBlobs.has(f.id)){blob=localBlobs.get(f.id);name=f.name}else if(f.body!==undefined){blob=new Blob([f.body],{type:'text/plain;charset=utf-8'});name=f.name}else{toast('原文件未保留，请重新选择本地文件。','info');return}}
 else{blob=new Blob([`叠云企业网盘 · UI 演示样例\n\n文件名：${f.name}\n显示大小：${f.size}\n类型：${fileTypeName[f.type]}\n位置：${locationName(f)}\n\n这是一份纯文本说明，不是原始 ${f.name.split('.').pop().toUpperCase()} 文件。\n界面中的所有业务内容均为虚构示例，仅用于体验 UI 与交互。\n没有服务器上传、真实分享或实际权限控制。\n`],{type:'text/plain;charset=utf-8'});name=f.name+'_演示说明.txt'}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast(f.userAdded?'已生成本地文件下载。':'已生成 TXT 样例说明，不是原始业务文件。');
}
function openUpload(){uploadDestination={parent:targetParent(),area:state.view==='spaceFiles'?'space':'mine',space:state.space};modal('添加本地文件',`<div class="upload-zone" data-action="chooseUpload" id="uploadZone" tabindex="0" role="button">${ic('upload')}<strong>点击选择，或拖放文件到这里</strong><p>支持一次选择多个文件</p>${btn('选择本地文件','chooseUpload','','primary small')}</div><p class="tiny-note" style="margin-top:17px">这是离线 UI 原型，不会向任何服务器上传文件。刷新后保留文件名等信息，原文件内容需重新选择。纯文本可本地预览，其他格式按支持情况显示。</p>`,btn('关闭','closeModal'));const zone=$('#uploadZone');zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});zone.addEventListener('dragleave',()=>zone.classList.remove('over'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');handleUpload([...e.dataTransfer.files])})}
async function handleUpload(inputFiles){if(!inputFiles.length)return;const dest=uploadDestination||{parent:'root',area:'mine',space:null};let added=[];for(const b of inputFiles.slice(0,100)){let name=b.name,n=1;while(duplicateName(name,dest.parent)){const dot=b.name.lastIndexOf('.'),base=dot>0?b.name.slice(0,dot):b.name,ext=dot>0?b.name.slice(dot):'';name=base+`（副本${n++}）`+ext}const ext=name.split('.').pop().toLowerCase();const type=({docx:'word',doc:'word',xlsx:'sheet',xls:'sheet',csv:'sheet',pdf:'pdf',fig:'fig',png:'image',jpg:'image',jpeg:'image',webp:'image',svg:'image',md:'md',txt:'md',zip:'zip'})[ext]||'other';const id=uid();const f={id,name,type,size:b.size>=1024*1024?(b.size/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(b.size/1024))+' KB',date:nowStamp(),by:'林沐',owner:'林沐',parent:dest.parent,area:dest.area,space:dest.space,userAdded:true,shared:dest.area==='space'};localBlobs.set(id,b);if(['txt','md','csv','json'].includes(ext)&&b.size<500000){try{f.body=await b.text()}catch{}}model.files.push(f);model.transfers.unshift({id,name,size:f.size,time:nowStamp()});added.push(f)}model.transfers=model.transfers.slice(0,50);persist();closeModal();setView(dest.area==='space'?'spaceFiles':'files',dest.parent,dest.space);toast(`已添加 ${added.length} 个本地文件，未上传到服务器。`);$('#uploadInput').value=''}

 `,btn('取消','closeModal')+btn('保存偏好','savePrefs','check','primary'),'prefs-modal');

function savePreferences(){
 if(!prefsDraft||!$('#prefDensity'))return;
 const layout=$('#prefLayout').value;
 const layoutChanged=model.prefs.layout!==layout;
 const next={...model.prefs,density:$('#prefDensity').value,layout,motion:$('#prefMotion').checked,
   primaryColor:normalizePrimaryColor($('#modalHost input[name="prefPrimaryColor"]:checked')?.value)};
 model.prefs=next;
 // Clear the draft before closing: a successful save must not roll back.
 prefsDraft=null;
 applyPrimaryColor(next.primaryColor);
 const stored=persist();
 if(layoutChanged){state.page=1;state.selected.clear()}
 closeModal();render();
 toast(stored?`界面偏好已保存 · ${PRIMARY_COLOR_NAMES[next.primaryColor]}`:'偏好已应用；浏览器未允许本地保存，仅当前会话有效。',stored?'checkcircle':'info');
}
function showHelp(){modal('使用说明',`<div class="help-block"><h3>这是一份可交互的离线原型</h3><p>左侧所有入口均可切换。“最近打开”展示你预览过的文件。文件名可点击打开；行内复选框用于批量操作；更多菜单提供详情、重命名、移动与分享。</p></div><div class="help-block"><h3>主色调与界面偏好</h3><p>通过头像菜单或工具栏的偏好图标打开“界面偏好”，在浅绿与商务蓝之间切换。点击配色即时预览，保存后记住选择；取消、关闭或按 Esc 会恢复原配色。文件类型与警告状态的颜色保持不变。</p></div><div class="help-block"><h3>本地文件与示例内容</h3><p>选择本地文件不会上传。内置文档、表格、图片预览均为示意，下载内置文件会生成 TXT 说明，不会伪装成真实 DOCX 或 XLSX 文件。</p></div><div class="help-block"><h3>共享只作用于原型</h3><p>协作者、外链、提取码和访问设置只用于演示。演示链接不可外部访问，不会发送邀请，也不代表服务端权限控制。</p></div><div class="keyboard-row"><span>搜索文件</span><kbd class="keycap">Ctrl / ⌘ K</kbd></div><div class="keyboard-row"><span>关闭面板、取消选择</span><kbd class="keycap">Esc</kbd></div><div class="keyboard-row"><span>文件行聚焦时打开</span><kbd class="keycap">Enter</kbd></div><p class="tiny-note" style="margin-top:17px">数据仅保存在当前浏览器，浏览器禁止本地存储时仅保留在当前会话。支持通过“界面偏好”恢复初始数据。</p>`,btn('开始体验','closeModal','','primary'))}

 case 'userMenu':popup(menuItem('界面偏好','preferences','sliders')+menuItem('使用说明','help','help')+'<div class="menu-sep"></div>'+`<div class="tiny-note" style="padding:8px 10px">林沐 · 产品设计部<br>当前为离线演示身份</div>`,target);break;
 case 'preferences':preferences();break;
 case 'savePrefs':savePreferences();break;
 case 'resetAsk':confirmModal('恢复初始演示数据？','将清除本原型中创建的文件记录、协作设置与外链，并恢复默认视图。不会删除电脑上的任何原文件。','resetConfirm','','恢复初始数据');break;
 case 'resetConfirm':model=makeData();localBlobs.clear();persist();closeModal();setView('files');toast('已恢复初始演示数据。');break;
 case 'mobileMenu':state.mobile=!state.mobile;$('#sidebar').classList.toggle('is-open',state.mobile);$('#sidebarScrim').classList.toggle('is-open',state.mobile);break;
 }
});
document.addEventListener('contextmenu',e=>{const target=e.target.closest('[data-id]');if(!target||!file(target.dataset.id)||state.modal)return;e.preventDefault();fileMenu(target.dataset.id,target)});
function downloadText(text,name){const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)}
function toggleSelect(id){if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);renderContent()}
document.addEventListener('change',e=>{
 if(e.target.name==='prefPrimaryColor'&&prefsDraft){
   const color=normalizePrimaryColor(e.target.value);
   prefsDraft.primaryColor=color;
   applyPrimaryColor(color);
   const changed=color!==model.prefs.primaryColor;
   $('#primaryColorHint').textContent=changed?`正在预览${PRIMARY_COLOR_NAMES[color]}，尚未保存；取消将恢复原配色。`:`当前为${PRIMARY_COLOR_NAMES[color]}。点击预览，保存后记住选择。`;
   return;
 }

 if(e.target.id==='pageSize'){
  const size=Number(e.target.value);if(![10,20,50,100].includes(size))return;
  state.pageSize=size;state.page=1;state.selected.clear();model.prefs.pageSize=size;persist();renderContent();return;
 }

 if(e.target.dataset.select){toggleSelect(e.target.dataset.select);return}
 if(e.target.id==='selectAll'){const list=displayedFiles();if(e.target.checked)list.forEach(f=>state.selected.add(f.id));else list.forEach(f=>state.selected.delete(f.id));renderContent()}
 if(e.target.id==='linkScope'){readShareFields();renderShare()}
 if(e.target.id==='uploadInput')handleUpload([...e.target.files]);
});
document.addEventListener('submit',e=>{
 if(e.target.getAttribute('id')!=='mainForm')return;e.preventDefault();const fd=new FormData(e.target),a=e.target.dataset.formAction,err=$('#formError');let name=String(fd.get('name')||'').trim();if(['newFolder','newDoc','renameSubmit','newSpaceSubmit'].includes(a)){const error=validateName(name);if(error){err.textContent=error;return}}
 if(a==='newFolder'||a==='newDoc'){
 const parent=targetParent();if(a==='newDoc'&&!/\.(md|txt)$/i.test(name))name+='.md';if(duplicateName(name,parent)){err.textContent='当前文件夹已存在同名项目，请使用其他名称。';return}const f={id:uid(),name,type:a==='newFolder'?'folder':'md',size:a==='newFolder'?'—':'1 KB',parent,area:state.view==='spaceFiles'?'space':'mine',space:state.space,owner:'林沐',by:'林沐',date:nowStamp(),shared:state.view==='spaceFiles',userAdded:true};if(a==='newDoc'){f.body=String(fd.get('body')||'');f.size=Math.max(1,Math.ceil(new Blob([f.body]).size/1024))+' KB'}else f.color='#90adc9';model.files.unshift(f);persist();closeModal();if(!['files','spaceFiles'].includes(state.view))setView('files');else render();toast(a==='newFolder'?'文件夹已在本地创建。':'本地文档已创建。');
 }else if(a==='renameSubmit'){const f=file(fd.get('id'));if(duplicateName(name,f.parent,f.id)){err.textContent='已存在同名文件，请使用其他名称。';return}f.name=name;f.date=nowStamp();persist();closeModal();render();toast('名称已更新。')}
 else if(a==='confirmMove'){const parent=String(fd.get('parent'));const selected=operationIds.map(file);if(selected.some(f=>duplicateName(f.name,parent,f.id))){err.textContent='目标文件夹存在同名项目，请先重命名后再移动。';return}selected.forEach(f=>f.parent=parent);persist();closeModal();state.selected.clear();render();toast(`已移动 ${selected.length} 个项目。`)}
 else if(a==='newSpaceSubmit'){if(model.spaces.some(s=>s.name===name)){err.textContent='已存在同名空间。';return}const s={id:uid(),name,desc:String(fd.get('desc')||'共同维护团队文件。'),members:1,owner:'林沐',color:'green',icon:'people'};model.spaces.push(s);persist();closeModal();setView('spaces');toast('本地协作空间已创建。')}
 else if(a==='linkFileSelected'){const id=String(fd.get('file'));closeModal();openShare(id,'external')}
});
let searchTimer;
$('#search').addEventListener('input',e=>{clearTimeout(searchTimer);const value=e.target.value;$('#clearSearch').hidden=!value;searchTimer=setTimeout(()=>{if(!value.trim()){setView('files');$('#search').focus();return}state.query=value;state.view='search';state.filter='all';state.selected.clear();state.page=1;state.sort='date';state.reverse=false;closeDetails();renderSidebar();renderContent();document.title='搜索结果 · 叠云'},120)});
document.addEventListener('keydown',e=>{
 const editable=e.target.matches('input,textarea,select,[contenteditable=true]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.modal)closeModal();$('#search').focus();$('#search').select();return}
 if(e.key==='Escape'){e.preventDefault();if(state.popup)closePopup();else if(state.modal)closeModal();else if(state.detail)closeDetails();else if(state.selected.size){state.selected.clear();renderContent()}else if(state.mobile){state.mobile=false;$('#sidebar').classList.remove('is-open');$('#sidebarScrim').classList.remove('is-open')}else if(state.view==='search')setView('files');return}
 if(e.key==='Tab'&&state.modal){const focusables=$$('#modalHost button:not(:disabled),#modalHost input:not(:disabled),#modalHost select:not(:disabled),#modalHost textarea:not(:disabled),#modalHost [tabindex="0"]').filter(el=>el.offsetParent!==null);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}
 if(e.key==='Tab'&&state.popup){/* Normal focus order is retained for compact command menus. */}
 if(!editable&&!state.modal&&e.target.matches('[data-row-id]')){if(e.key==='Enter'){e.preventDefault();openFile(e.target.dataset.rowId)}if(e.key===' '){e.preventDefault();const id=e.target.dataset.rowId;toggleSelect(id);$(`[data-row-id="${id}"]`)?.focus()}}
 if(e.target.id==='uploadZone'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#uploadInput').click()}
});
$('#modalHost').addEventListener('click',e=>{if(e.target===$('#modalHost'))closeModal()});
$('#sidebarScrim').addEventListener('click',()=>{state.mobile=false;$('#sidebar').classList.remove('is-open');$('#sidebarScrim').classList.remove('is-open')});
window.addEventListener('resize',()=>{if(state.popup)closePopup()});
window.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files'))e.preventDefault()});
window.addEventListener('drop',e=>{if(e.dataTransfer?.files.length&&!e.target.closest('#uploadZone')){e.preventDefault();uploadDestination={parent:targetParent(),area:state.view==='spaceFiles'?'space':'mine',space:state.space};handleUpload([...e.dataTransfer.files])}});
render();

$$('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic));

</script></body></html>
